name: Deploy backend

# 브랜치별로 배포 대상이 다르다. 이미지를 빌드해 GHCR 에 올리고, 해당 서버에서 backend 컨테이너만 교체한다.
#   main    → 운영 서버   (이미지 태그 :latest)
#   develop → 맥미니(테스트) (이미지 태그 :develop, Tailscale 로 SSH 접속)
# (db, nginx, frontend 는 건드리지 않는다. compose/nginx 설정은 academy-infra 에서 관리)
#
# 필요한 시크릿
#   운영:   SERVER_HOST, SSH_PRIVATE_KEY
#   맥미니: DEV_SERVER_HOST(Tailscale 이름/IP), DEV_SSH_USER, DEV_SSH_PRIVATE_KEY, DEV_INFRA_DIR(맥미니의 academy-infra 경로),
#           TS_OAUTH_CLIENT_ID, TS_OAUTH_SECRET (Tailscale OAuth 클라이언트, 태그 tag:ci)
# 서버 선행 조건: academy-infra clone + .env + nginx/ssl(운영만) — 엑셀 양식은 infra 의 data/templates 에 있음
#   맥미니는 backend · frontend 만 있는 별도 compose(docker/compose.macmini.yml, ./compose.macmini.sh)를 쓴다 — DB · nginx 는 맥미니에 있는 것 사용
#   이미지 태그는 맥미니 compose 의 기본값이 :develop, 운영 compose 는 :latest 라서 .env 에 이미지 변수를 둘 필요가 없다.

on:
  push:
    branches:
      - main
      - develop
    paths-ignore:
      - '**.md'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/pull_request_template.md'
  workflow_dispatch:

# 배포가 겹치지 않도록 — 진행 중인 배포는 끝까지 두고 다음 배포를 줄 세운다
# (환경별로 따로 줄 세운다)
concurrency:
  group: deploy-backend-${{ github.ref_name }}
  cancel-in-progress: false

env:
  # GHCR 이미지 이름은 소문자여야 한다 (조직 이름이 대문자를 포함하므로 고정값으로 쓴다)
  IMAGE: ghcr.io/heungkuk-academy/academy-backend

jobs:
  # ── 이미지 빌드 ────────────────────────────────────────────
  build:
    name: Build and push image
    # main, develop 외의 브랜치에서 수동 실행해도 배포되지 않도록 막는다
    if: github.ref_name == 'main' || github.ref_name == 'develop'
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.ref_name == 'main' && 'latest' || 'develop' }}
            ${{ env.IMAGE }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── 배포 ────────────────────────────────────────────────────
  # 서버는 pull + 교체만 하므로 수 초면 끝난다.
  deploy:
    name: Deploy to ${{ github.ref_name == 'main' && 'production' || 'mac mini' }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      # develop 은 사설망(맥미니)이라 GitHub 러너를 Tailscale 에 임시로 붙인다 (job 이 끝나면 노드가 사라진다)
      - name: Connect to Tailscale
        if: github.ref_name == 'develop'
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          INFRA_DIR: ${{ github.ref_name == 'main' && '/home/ubuntu/academy-infra' || secrets.DEV_INFRA_DIR }}
          # 맥미니는 backend · frontend 만 있는 별도 compose 를 쓴다
          COMPOSE_SH: ${{ github.ref_name == 'main' && './compose.sh' || './compose.macmini.sh' }}
        with:
          host: ${{ github.ref_name == 'main' && secrets.SERVER_HOST || secrets.DEV_SERVER_HOST }}
          username: ${{ github.ref_name == 'main' && 'ubuntu' || secrets.DEV_SSH_USER }}
          key: ${{ github.ref_name == 'main' && secrets.SSH_PRIVATE_KEY || secrets.DEV_SSH_PRIVATE_KEY }}
          envs: INFRA_DIR,COMPOSE_SH
          script: |
            set -e
            # SSH 비대화형 셸은 PATH 가 짧아 맥(Homebrew / Docker Desktop / OrbStack)에서 docker 를 못 찾는다
            export PATH="/opt/homebrew/bin:/usr/local/bin:$HOME/.orbstack/bin:/Applications/Docker.app/Contents/Resources/bin:$PATH"
            cd "$INFRA_DIR"

            # 엑셀 양식 로드 로그는 컨테이너 콘솔(docker logs)에서 확인한다.
            # logs/reservation.log 의 줄 수 비교는 날짜가 바뀐 뒤 첫 기동 때 파일이 롤링(새 파일)되어
            # 줄 수가 오히려 줄어들기 때문에 쓰지 않는다. 컨테이너를 새로 만들므로 docker logs 에는 이번 기동 로그만 있다.
            BACKEND_CONTAINER=spring
            template_logs() { docker logs "$BACKEND_CONTAINER" 2>&1 | grep '엑셀 양식 로드' || true; }
            count() { template_logs | grep -c . || true; }

            # backend 만 교체 — 항상 서비스 이름을 지정하고 --no-deps 로 db 를 건드리지 않는다
            $COMPOSE_SH pull backend
            $COMPOSE_SH up -d --no-deps backend

            # nginx 는 upstream(spring) 이름을 시작·reload 때만 해석하므로 컨테이너 재생성 직후 reload 한다
            # (reload 는 기존 연결을 끊지 않고, 설정이 잘못되면 기존 설정을 유지한다.
            #  앱이 늦게 뜨거나 아래 확인이 실패해도 nginx 가 이전 IP 를 쥐고 있지 않도록 확인보다 먼저 한다)
            # 맥미니는 기존 nginx 가 고정 주소로 접속하므로 hka-nginx 가 없다 — 있을 때만 reload
            if docker ps --format '{{.Names}}' | grep -qx hka-nginx; then docker exec hka-nginx nginx -s reload; fi

            # 기동 후 양식 로드 로그 3개(견적서/거래명세서/확인서)가 찍힐 때까지 대기 (최대 약 90초)
            NOW=0
            for i in $(seq 1 30); do
              NOW=$(count)
              [ "$NOW" -ge 3 ] && break
              sleep 3
            done

            if [ "$NOW" -lt 3 ]; then
              echo "기동 확인 실패: 엑셀 양식 로드 로그가 찍히지 않았습니다."
              $COMPOSE_SH logs --tail=50 backend
              exit 1
            fi

            if template_logs | grep -q '파일 없음'; then
              echo "엑셀 양식 파일을 찾지 못했습니다. 서버 academy-infra 의 data/templates 파일 3개와 마운트를 확인하세요."
              template_logs
              exit 1
            fi
            echo "엑셀 양식 로드 확인: 외부 경로 사용 3개"

            # 안 쓰는 이미지 정리 — 어떤 컨테이너도 쓰지 않고 만든 지 7일 지난 이미지
            # (최근 7일 이미지는 롤백용으로 남김, 오래된 이미지는 GHCR 에서 SHA 태그로 다시 받을 수 있음)
            # 운영 서버에서만 실행한다. 맥미니는 다른 앱의 이미지도 있어서 미사용 이미지를 지우면 안 된다.
            if [ "$COMPOSE_SH" = "./compose.sh" ]; then
              docker image prune -af --filter "until=168h"
            fi
